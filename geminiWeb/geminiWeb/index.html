<!DOCTYPE html>
<html>
<style>

        height: 100vh;
        /* Using standard linear-gradient for 2025 modern browser support */

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        margin: 0;
    }

    /* Container to hold images side-by-side */

</style>

    <h1> New Web Pages </h1>
    
    <div class="image-container">
        <!-- Image link for Gemini -->

        </a>

        <!-- Image link for Mall Rats -->
        <a href="mallrats.html">

</html>
