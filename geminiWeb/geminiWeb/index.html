<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="commonStyles.css">
    <link rel="stylesheet" href="theme.css">
    <style>
    body {
        height: 100vh;
        /* Using standard linear-gradient for 2025 modern browser support */
        background: linear-gradient(70deg, crimson 30%, rgba(0,0,0,0) 30%), 
                    linear-gradient(30deg, green 60%, purple 60%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        margin: 0;
    }

    /* Container to hold images side-by-side */
    .image-container {
        display: flex;
        gap: 20px; /* Adjust this value for space between the images */
        align-items: center;
    }

    /* Page-specific image sizing for index.html only */
    .image-container img {
        max-width: 220px;/* biggest on wide screens */
        width: 100%;
        height: auto;
        display: block;
    }

    /* Slightly smaller logo */
    .image-container img.logo {
        max-width: 200px;
        width: 200px;
    }

    /* Responsive adjustments for narrow screens */
    @media (max-width: 600px) {
        .image-container {
            flex-direction: column;
            gap: 12px;
        }
        .image-container img {
            max-width: 60vw;
        }
        .image-container img.logo {
            max-width: 50vw;
            width: auto;
        }
    }

    /* Index-only sponsor-rail overrides to keep logos small and scrolling */
    .sponsor-rail {
        width: 90px;
        height: 50vh;
    }
    .sponsor-rail img {
        max-width: 70px;
        height: auto;
        display: block;
    }
    .sponsor-rail .rail-inner {
        gap: 12px;
        animation-duration: 18s;
    }

</style>
</head>
<body>


    <h1> New Web Pages </h1>
    
    <div class="image-container">
        <!-- Image link for Gemini -->
        <a href="gemini.html">
            <img class="logo" src="images/geminiTransparentBackground.png" alt="Gemini Link">
        </a>

        <!-- Image link for Mall Rats -->
        <a href="mallrats.html">
            <img src="images/mallrats.png" alt="Mall Rats Link">
        </a>
    </div>


    <footer class="sponsor-footer" aria-hidden="false">
        <div class="sponsor-thanks-inner"><strong>Thanks to our sponsors</strong></div>
        <div class="sponsor-logos">
            <img src="sponsors/L3Harris_Technologies-Logo.png" alt="L3Harris">
            <img src="sponsors/main-logo-oswald.svg" alt="Main Logo">
            <img src="sponsors/stark-industries.png" alt="Stark Industries">
            <img src="sponsors/GSEP-logo.png" alt="Diet Pepsi">
            <img src="sponsors/Corellian_Engineering_Corporation.svg" alt="Corellian">
            <img src="sponsors/DoD-STEM-logo.png" alt="DnD">
            <img src="sponsors/Airbnb_Logo.png" alt="Airbnb">
        </div>
    </footer>
</body>
</html>
