<!-- Sponsor Links Template

Place your sponsor links here. Copy/paste the <a> blocks into the sponsor-rail "rail-inner" on any page, or edit this file and use the same structure.

Notes:
- Use a full URL for the link (https://example.com) and include target="_blank" and rel="noopener" to open in a new tab safely.
- Because the rails use duplicated images for continuous scrolling, add the link to both copies if you want the duplicates to be clickable.
- You can use relative paths for the image src (e.g., sponsors/L3Harris_Technologies-Logo.png)

Example anchor blocks (add or replace the src/url/alt text):

<a href="https://www.l3harris.com" target="_blank" rel="noopener">
    <img src="sponsors/L3Harris_Technologies-Logo.png" alt="L3Harris Technologies">
</a>

<a href="https://www.example.com" target="_blank" rel="noopener">
    <img src="sponsors/main-logo-oswald.svg" alt="Main Sponsor">
</a>

<!-- JSON example for future automation (optional):
[
  { "src": "sponsors/L3Harris_Technologies-Logo.png", "url": "https://www.l3harris.com", "alt": "L3Harris Technologies" },
  { "src": "sponsors/main-logo-oswald.svg", "url": "https://www.example.com", "alt": "Main Sponsor" }
]
-->

<!-- When you're done, save this file. To make the rails use these links automatically we can add a small JS loader later if you'd like. -->
